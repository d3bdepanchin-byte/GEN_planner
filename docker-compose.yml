services:
  db:
    image: postgres:16
    # После перезагрузки сервера БД поднимается сама: без неё воркер не отправит и алерт.
    restart: unless-stopped
    environment:
      POSTGRES_USER: planerka
      POSTGRES_PASSWORD: planerka  # локальная dev-база, не секрет
      POSTGRES_DB: planerka
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planerka -d planerka"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        INSTALL_ASR: ${INSTALL_ASR:-1}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://planerka:planerka@db:5432/planerka
      DATABASE_URL_TEST: postgresql+psycopg://planerka:planerka@db:5432/planerka_test
      # Как у worker (R16): модели только из локального кэша, без обращения к сети.
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/models/hf
    volumes:
      - .:/app
    working_dir: /app

  worker:
    build:
      context: .
      args:
        INSTALL_ASR: ${INSTALL_ASR:-1}
    command: planerka worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://planerka:planerka@db:5432/planerka
      # Модели — только из локального кэша (R16): переменные до старта процесса.
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/models/hf
      DATA_DIR: /app/data
      INBOX_DIR: /app/inbox
      MODELS_DIR: /app/models
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      # Папка-приёмник «Записи встреч»: система только читает и копирует (Д-69).
      - ${INBOX_HOST_DIR:-./data/inbox}:/app/inbox:ro
      - ./models:/app/models
      - ./backups:/app/backups
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
    working_dir: /app

volumes:
  pgdata:
